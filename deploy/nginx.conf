# Include inside the existing HTTPS server block for 0x123k.pl.
# TLS certificates and the HTTP-to-HTTPS redirect are managed by host nginx.
# Allow multipart overhead above the application's 256 MiB request limit.
client_max_body_size 257m;

location / {
    # GET also permits HEAD. Uploads, remote fetches, and management require login.
    limit_except GET {
        auth_basic "0x123k.pl";
        auth_basic_user_file /etc/nginx/0x123k.htpasswd;
    }
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
